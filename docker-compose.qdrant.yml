## Qdrant vector database for the Wikipedia RAG index.
## Start on the server with:  docker compose -f docker-compose.qdrant.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: citybot-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # REST API (localhost only)
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
