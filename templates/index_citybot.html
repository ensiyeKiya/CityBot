<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>City Bot Chat</title>

  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.112/Build/Cesium/Cesium.js"></script>
  <!-- Remove MQTT script since we're using WoT events -->
  <!-- <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script> -->
  <link  href="https://cesium.com/downloads/cesiumjs/releases/1.112/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <!-- WoT (browser bundle, UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@node-wot/browser-bundle@0.9.0/dist/wot-bundle.min.js"></script>
  
  <!-- MQTT.js for WebSocket MQTT support -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <!-- INJECT_APP_CONFIG -->
  <script>
    if (typeof window.WoT === 'undefined') {
      console.error('Failed to load WoT library from CDN');
    }

    const config = {
      ...window.APP_CONFIG,
      SCHEME: window.location.protocol === 'https:' ? 'wss' : 'ws',
      DEFAULT_PORT: window.location.protocol === 'https:' ? 8084 : 8083,
    };
  </script>

  <link rel="stylesheet" href="/css/index_citybot.css">
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- Building Info Panel -->
  <div id="buildingInfoPanel" style="
    position: absolute;
    top: 80px;
    left: 20px;
    width: 350px;
    max-height: 600px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
  ">
    <div style="
      height: var(--header-height);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: 600;
    ">
      <span>Building Information</span>
      <button id="closeBuildingInfo" style="
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        width: 30px;
        height: 30px;
      ">×</button>
    </div>
    <div id="buildingInfoContent" style="
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      background: transparent;
    "></div>
  </div>

  <div id="chatPanel">
    <div class="resize-handle-top" id="resizeHandleTop"></div>
    <button class="maximize-btn-floating" id="maximizeBtn" title="Maximize chat">+</button>
    <div class="chat-header">
      <div class="drag-handle">⋮⋮</div>
      <span class="chat-header-title">City Bot Assistant</span>
      <div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 10px; margin-left: auto; margin-right: 10px;">
        <span class="user-name" id="userName" style="font-size: 12px; color: #fff;">Loading...</span>
        <button class="logout-btn" id="logoutBtn" title="Logout" style="background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px;">Logout</button>
      </div>
      <button id="historyBtn" title="View chat history">&#128203;</button>
      <button class="minimize-btn" id="minimizeBtn" title="Minimize chat">−</button>
    </div>

    <!-- History overlay (slides over the message area) -->
    <div id="historyPanel">
      <div class="history-sub-header">
        <button id="historyBackBtn">&#8592; Back</button>
        <span id="historyPanelTitle">Chat History</span>
      </div>
      <div id="historySessionList"></div>
      <div id="historyMessageView" style="display:none;"></div>
    </div>

    <div id="chatMessages">
      <div class="message bot-message">
        <div class="message-content">Welcome to City Bot. I can help you navigate the map and find locations. Type a message or use the microphone to get started.</div>
        <div class="message-time">Now</div>
      </div>
    </div>

    <!--
      Wrap the input in a form right in the markup.  
      Using a form + submit is the simplest, most reliable way to capture the **Enter** key everywhere
      (desktop, mobile, IME, etc.) without extra key‑handling code.
    -->
    <div id="chatInput">
      <form id="chatForm" autocomplete="off">
        <button id="micButton" type="button" class="mic red" title="Start voice input">
          <svg class="mic-icon mic-icon-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <svg class="mic-icon mic-icon-on" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            <circle cx="12" cy="11" r="4" fill-opacity="0.3"/>
          </svg>
          <svg class="mic-icon mic-icon-stop" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" rx="2" ry="2"/>
          </svg>
        </button>
        <input id="messageInput" type="text" placeholder="Type your message…" aria-label="Message input" />
        <button id="sendButton" type="submit" title="Send message">
          <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
        <div class="preset-menu-container">
          <button id="presetMenuButton" type="button" class="preset-menu-btn" title="Preset questions" aria-label="Open preset questions menu">
            <svg class="ellipsis-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="5" r="2"/>
              <circle cx="12" cy="12" r="2"/>
              <circle cx="12" cy="19" r="2"/>
            </svg>
          </button>
          <div id="presetMenu" class="preset-menu-dropdown">
            <button type="button" class="preset-question-item" data-question="Zoom in to the National Palace of Culture">Zoom in to the National Palace of Culture</button>
            <button type="button" class="preset-question-item" data-question="Fly to Paris">Fly to Paris</button>
            <button type="button" class="preset-question-item" data-question="Load the 3D tileset">Load the 3D tileset</button>
            <button type="button" class="preset-question-item" data-question="Show the hospitals in red color">Show the hospitals in red color</button>
            <button type="button" class="preset-question-item" data-question="Show the buildings with the best walkability index">Show the buildings with the best walkability index</button>
            <button type="button" class="preset-question-item" data-question="Show all the sensors">Show all the sensors</button>
            <button type="button" class="preset-question-item" data-question="Show the PM2.5 sensors">Show the PM2.5 sensors</button>
            <button type="button" class="preset-question-item" data-question="Show the tallest buildings">Show the tallest buildings</button>
            <button type="button" class="preset-question-item" data-question="What is the current value of nitrogen dioxide (NO2) at the AT12 sensor?">
              What is the current value of nitrogen ioxide (NO2) at the AT12 sensor?</button>
            <button type="button" class="preset-question-item" data-question="What is the current value of Nitrogen Dioxide (NO2) at the AT12 sensor?">What is the current value of Nitrogen Dioxide (NO2) at the AT12 sensor?</button>
            <button type="button" class="preset-question-item" data-question="What is the current value of Nitrogen Dioxide (NO2) at the AT12 sensor?">What is the current value of Nitrogen Dioxide (NO2) at the AT12 sensor?</button>
            <button type="button" class="preset-question-item" data-question="What is the current weather in Sofia, Bulgaria?">What is the current weather in Sofia, Bulgaria?</button>
            <button type="button" class="preset-question-item" data-question="Fly to Sofia, Bulgaria">Fly to Sofia, Bulgaria</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.22/dist/bundle.min.js"></script>

  <script>
    // Global error handler to catch and log errors with more context
    window.addEventListener('error', function(event) {
      console.error('Global error caught:', {
        message: event.message,
        source: event.filename,
        lineNo: event.lineno,
        colNo: event.colno,
        error: event.error
      });
      
      // Try to get more context if it's from the MQTT library
      if (event.filename && event.filename.includes('mqtt')) {
        console.error('MQTT library error details:', {
          stack: event.error?.stack,
          name: event.error?.name,
          additionalInfo: event.error?.toString()
        });
      }
    });
  </script>

<script type="module">
    
    /* ========================= 2. Cesium viewer ======================= */

    Cesium.Ion.defaultAccessToken = config.ION_ACCESS_TOKEN;

    // Initialize Cesium asynchronously with timeout handling
    async function initCesium() {
      try {        
        // Create terrain provider with timeout handling
        let terrainProvider;
        try {          const terrainResource = await Promise.race([
            Cesium.IonResource.fromAssetId(2564867, {
              accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjNWUzZmI0ZS02NDcxLTRlNjktYTcyYi00OWZlNTA4ZmViMTAiLCJpZCI6NDY4MjksImlhdCI6MTYxNjYwMTM4Nn0.3KOIXUjF4QpChsVKmW9pNy5WdE6qi3C61jBJc9VJGIQ"
            }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Terrain resource timeout')), 15000))
          ]);

          terrainProvider = await Promise.race([
            Cesium.CesiumTerrainProvider.fromUrl(terrainResource, {
              requestVertexNormals: true,
            }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Terrain provider timeout')), 10000))
          ]);        } catch (error) {
          console.warn('⚠️ Failed to load Ion terrain, using default terrain:', error.message);
          // Fallback to default terrain
          terrainProvider = new Cesium.EllipsoidTerrainProvider();
        }

        // Make viewer globally available
        window.viewer = new Cesium.Viewer('cesiumContainer', {
          terrainProvider: terrainProvider,
          animation: true,   // show the playback controls (date & time read‑out)
          baseLayerPicker: false,
          fullscreenButton: false,
          geocoder: false,
          homeButton: false,
          infoBox: true,  // Enable InfoBox to show entity descriptions
          sceneModePicker: false,
          selectionIndicator: false,
          timeline:  true,   // show the timeline scrub bar
          navigationHelpButton: false,
          navigationInstructionsInitiallyVisible: false,
          contextOptions: { webgl: { alpha: true } }
        });

        performance.mark('viewer-start');
        // Ensure atmosphere is rendered so the night‑side of Earth is never completely black
        window.viewer.scene.skyAtmosphere = new Cesium.SkyAtmosphere();

        // Add Photorealistic 3D Tiles for realistic 3D buildings and terrain with timeout
        try {          window.googleTileset = await Promise.race([
            Cesium.Cesium3DTileset.fromIonAssetId(2275207, {
              enableDebugWireframe: false
            }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Google tileset timeout')), 20000))
          ]);
          
          window.googleTileset.id = 'google-photorealistic-tileset';
          window.viewer.scene.primitives.add(window.googleTileset);        } catch (error) {
          console.warn(`⚠️ Error loading Photorealistic 3D Tiles tileset: ${error.message}`);
          window.googleTileset = null;
        }

        // Set initial camera view
        window.viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(23.3219, 42.6977, 10000),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-90),
            roll: 0
          }
        });

        // Keep imagery fully lit to prevent night-side blackouts
        window.viewer.scene.globe.enableLighting = false;
        window.viewer.scene.globe.atmosphereBrightnessShift = 0.1;
        window.viewer.scene.globe.atmosphereSaturationShift = 0.8;

        // Make tilesAreLoaded a global variable
        window.tilesAreLoaded = false;
        window.viewer.scene.globe.tileLoadProgressEvent.addEventListener((remaining) => {
          if (remaining === 0) {
            window.tilesAreLoaded = true;
            window.viewer.scene.requestRender();
          }
        });
        
        // Add click handler for both buildings (3D tiles) and sensors (entities)
        const handler = new Cesium.ScreenSpaceEventHandler(window.viewer.scene.canvas);
        handler.setInputAction((movement) => {
          const picked = window.viewer.scene.pick(movement.position);
          
          // Check if we clicked on a 3D tile feature (building)
        if (picked && picked instanceof Cesium.Cesium3DTileFeature) {          
          // Hide InfoBox for buildings
          window.viewer.selectedEntity = undefined;
          
          window.handleBuildingClick(picked);

          // Report selection to backend for LLM awareness
          try {
            if (window.thing) {
              const propIds = picked.getPropertyIds();
              const props = {};
              for (let i = 0; i < propIds.length; i++) {
                const k = propIds[i];
                props[k] = picked.getProperty(k);
              }
              // Build data object and filter out undefined/invalid values
              const buildingData = {
                gmlId: props.gml_id || props.GMLID,
                coordinates: {
                  latitude: props.lat,
                  longitude: props.lon,
                  height: props.citygml_measured_height
                },
                class: props.citygml_class_description,
                function: props.citygml_function_description,
                addr: props.addr,
                wiki_title_bg: props.wiki_title_bg,
                wiki_pageid: props.wiki_pageid,
                wikidata_instances: props.wikidata_instances,
                walk_access_index: props.walk_access_index,
                sunhrs_int_avg: props.sunhrs_int_avg,
                timestamp: new Date().toISOString()
              };              
              // Remove undefined, null, and NaN values to satisfy WoT schema validation
              Object.keys(buildingData).forEach(key => {
                const value = buildingData[key];
                if (value === undefined || value === null || (typeof value === 'number' && isNaN(value))) {
                  delete buildingData[key];
                }
              });
              
              // Clean up coordinates object - remove invalid values
              if (buildingData.coordinates) {
                Object.keys(buildingData.coordinates).forEach(key => {
                  const value = buildingData.coordinates[key];
                  if (value === undefined || value === null || (typeof value === 'number' && isNaN(value))) {
                    delete buildingData.coordinates[key];
                  }
                });
                
                // If coordinates object is empty after cleanup, remove it entirely
                if (Object.keys(buildingData.coordinates).length === 0) {
                  delete buildingData.coordinates;                }
              }
              window.llmSelectedBuilding = withUserId({ ...buildingData });
              
              window.thing.writeProperty('selectedBuildingState', withUserId(buildingData))
                .then(() => {                })
                .catch(err => {
                  console.error('❌ Failed to write building selection:', err);
                });
              
            }
          } catch (err) {
            console.error('❌ Failed to report building selection:', err);
          }
        } else if (picked && picked.id && picked.id instanceof Cesium.Entity) {
          // Check if we clicked on an entity (sensor)          
          // Show InfoBox for sensors by selecting the entity
          window.viewer.selectedEntity = picked.id;
        } else {
          // Clicked on nothing - deselect everything
          window.viewer.selectedEntity = undefined;
          
          // Reset building color and close building info panel
          if (window.selectedBuildingFeature) {
            window.selectedBuildingFeature.color = Cesium.Color.WHITE;
            window.selectedBuildingFeature = null;          }
          
          // Hide building info panel if visible
          const buildingInfoPanel = document.getElementById('buildingInfoPanel');
          if (buildingInfoPanel && buildingInfoPanel.style.display === 'flex') {
            buildingInfoPanel.style.display = 'none';
            window.selectedBuilding = null;            
            // Notify server that building has been deselected
            if (window.thing) {
              window.llmSelectedBuilding = withUserId({
                gmlId: null,
                class: null,
                function: null,
                addr: null,
                wiki_title_bg: null,
                wiki_pageid: null,
                wikidata_instances: null,
                walk_access_index: null,
                sunhrs_int_avg: null,
                timestamp: new Date().toISOString()
              });
              window.thing.writeProperty('selectedBuildingState', window.llmSelectedBuilding).then(() => {              }).catch(err => {
                console.error('❌ Failed to send building deselection:', err);
              });
            }
          }
        }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);        
      } catch (error) {
        console.error('❌ Critical error during Cesium initialization:', error);
        throw error;
      }
    }

    // Global variables for camera state and WoT connections
    window.lastCameraState = null;
    window.thing = null; // Will be set after WoT connection
    window.llmThing = null; // Will be set after LLM WoT connection
    window.isOwnCameraUpdate = false; // Flag to prevent self-updates
    window.lastOwnUpdateTime = 0;
    window.queue = [];
    window.flying = false;
    window.programmaticMove = false;
    // Streaming state for LLM conversation
    window.activeStreamRequestId = null;
    window.streamMessageContentEl = null;
    // STT request tracking
    window.pendingSTTRequests = {};
    window.transcribeAudioCallCount = 0;
    // TTS handling for streaming
    window.shouldDoTTSAfterStream = false;
    // MQTT debugging
    window.conversationStreamStats = null;
    // Visualization style tracking
    window.pendingVisualizationStyle = null;
    window.sofiaTileset = null; // Will store the Sofia tileset reference
    // Building interaction
    window.selectedBuilding = null;
    window.selectedBuildingFeature = null; // Store the actual Cesium feature for highlighting
    window.llmSelectedBuilding = null;

    function withUserId(payload) {
      if (window.currentUserId != null) {
        payload.userId = window.currentUserId;
      }
      return payload;
    }

    function getLlmContextPayload() {
      return {
        selectedBuilding: window.llmSelectedBuilding,
        mapState: window.lastCameraState
      };
    }

    function requireLoggedInUserId() {
      if (window.currentUserId == null) {
        throw new Error('Not logged in — missing userId. Please refresh and log in again.');
      }
      return window.currentUserId;
    }
    
    // Function to apply visualization styles from server-provided definition
    window.applyVisualizationStyle = function(styleDefinition, styleName) {      
      if (!window.sofiaTileset) {
        console.error('❌ Sofia tileset not loaded yet');
        return;
      }
      
      if (!styleDefinition) {
        console.error('❌ No style definition provided');
        return;
      }
      
      try {
        // Create Cesium 3D tile style from server-provided definition        const cesiumStyle = new Cesium.Cesium3DTileStyle(styleDefinition);
        window.sofiaTileset.style = cesiumStyle;      } catch (error) {
        console.error(`❌ Failed to apply style ${styleName}:`, error);
        console.error(`❌ Error details:`, {
          message: error.message,
          stack: error.stack,
          styleDefinition: styleDefinition
        });
      }
    };
    
    // Define emitCameraState function to use WoT property instead of MQTT
    window.emitCameraState = async () => {      // Don't emit if thing is not yet connected
      if (!window.thing) {        return;
      }
      
      const position = window.viewer.camera.positionCartographic;
      const currentState = {
        latitude: Cesium.Math.toDegrees(position.latitude),
        longitude: Cesium.Math.toDegrees(position.longitude),
        height: position.height,
        heading: Cesium.Math.toDegrees(window.viewer.camera.heading),
        pitch: Cesium.Math.toDegrees(window.viewer.camera.pitch),
        roll: Cesium.Math.toDegrees(window.viewer.camera.roll),
        timestamp: new Date().toISOString()
      };

      // Only emit if camera state has changed significantly
      if (!window.lastCameraState 
          || 
          Math.abs(currentState.latitude - window.lastCameraState.latitude) > 0.001 ||
          Math.abs(currentState.longitude - window.lastCameraState.longitude) > 0.001 ||
          Math.abs(currentState.height - window.lastCameraState.height) > 100
        ) {
        
        try {
          // Set flag to prevent processing our own camera update
          window.isOwnCameraUpdate = true;
          window.lastOwnUpdateTime = Date.now();
          
          // Use WoT property write instead of MQTT
          await window.thing.writeProperty('cameraState', withUserId({
            coordinates: {
              latitude: currentState.latitude,
              longitude: currentState.longitude,
              height: currentState.height
            },
            camera: {
              heading: currentState.heading,
              pitch: currentState.pitch,
              roll: currentState.roll
            },
            time: currentState.timestamp
          }));          window.lastCameraState = currentState;
          
          // Reset flag after a longer delay to allow the event to be processed
          setTimeout(() => {
            window.isOwnCameraUpdate = false;
          }, 300);
        } catch (error) {
          console.error('❌ Failed to update camera state:', error);
          window.isOwnCameraUpdate = false;
        }
      }
    };

    // Subscribe to WoT events instead of using MQTT
    window.subscribeToWoTEvents = async function() {
      if (!window.thing) {        return;
      }
      
      try {
        // All events now handled via MQTT - no WoT subscriptions needed        
        // Define message handlers for MQTT
        window.handleConversationStreamMessage = async (payload, transport) => {
          if (!payload) {            return;
          }

          // Track message sequence for loss detection
          if (!window.conversationStreamStats) {
            window.conversationStreamStats = {
              totalMessages: 0,
              tokenMessages: 0,
              planningMessages: 0,
              finalMessages: 0,
              lastMessageTime: null,
              requestId: null
            };
          }
          
          window.conversationStreamStats.totalMessages++;
          window.conversationStreamStats.lastMessageTime = new Date().toISOString();
          
          if (payload.requestId && window.conversationStreamStats.requestId !== payload.requestId) {
            window.conversationStreamStats.requestId = payload.requestId;
            window.conversationStreamStats.tokenMessages = 0;
            window.conversationStreamStats.planningMessages = 0;
            window.conversationStreamStats.finalMessages = 0;
          }

          // Check if this is an auto-generated building analysis
          // Check both the metadata flag and the requestId pattern
          const isAutoBuildingAnalysis = payload.metadata?.autoBuildingAnalysis === true || 
                                          (payload.requestId && payload.requestId.startsWith('llm-auto-building-'));
          
          if (!window.activeStreamRequestId && payload.requestId) {
            window.activeStreamRequestId = payload.requestId;
          }
          
          // Allow auto-generated building analysis through even if it doesn't match activeStreamRequestId
          if (payload.requestId !== window.activeStreamRequestId && !isAutoBuildingAnalysis) {            return;
          }
          
          // If this is auto-building analysis, switch to this requestId
          if (isAutoBuildingAnalysis && payload.requestId !== window.activeStreamRequestId) {            window.activeStreamRequestId = payload.requestId;
            // Reset stream state for new auto-analysis
            window.streamMessageContentEl = null;
            window.streamAccumulatedText = '';
          }

          // Handle planning updates - show them in the thinking message
          if (payload.metadata?.planningUpdate && !payload.isFinal) {
            window.conversationStreamStats.planningMessages++;

            // Find and update the thinking message
            const thinkingMessage = document.querySelector('.thinking:last-child');
            if (thinkingMessage) {
              const contentEl = thinkingMessage.querySelector('.message-content');
              if (contentEl) {
                contentEl.textContent = payload.metadata.planningUpdate;
              }
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return;
          }

          if (!payload.isFinal && payload.token) {
            window.conversationStreamStats.tokenMessages++;

            // Create message element only when we have the first token
            if (!window.streamMessageContentEl) {
              document.querySelectorAll('.thinking').forEach(thinkingMsg => {
                thinkingMsg.remove();
              });
              
              const messageElement = window.addMessage('', false);
              window.streamMessageContentEl = messageElement.querySelector('.message-content');
              window.streamAccumulatedText = ''; // Initialize accumulated text
            }
            
            // For streaming, we need to accumulate text and then convert to HTML
            if (!window.streamAccumulatedText) window.streamAccumulatedText = '';
            const previousLength = window.streamAccumulatedText.length;
            window.streamAccumulatedText += payload.token;
            
            window.streamMessageContentEl.innerHTML = markdownToHtml(window.streamAccumulatedText);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          } else if (payload.isFinal) {
            window.conversationStreamStats.finalMessages++;

            // Handle case where we get final response without any streaming tokens

        function getColorForPollution(value, parameter) {
          const config = airQualityConfig[parameter] || airQualityConfig['PM10'];
          const thresholds = config.thresholds;
          const alphas = [0.5, 0.55, 0.6, 0.65, 0.7];
          const colors = [
            [0.0, 0.8, 0.0],   // green - good
            [1.0, 1.0, 0.0],   // yellow - moderate
            [1.0, 0.65, 0.0],  // orange - poor
            [1.0, 0.0, 0.0],   // red - very poor
            [0.55, 0.0, 0.0],  // dark red - hazardous
          ];
          for (let i = 0; i < thresholds.length; i++) {
            if (value <= thresholds[i]) {
              return new Cesium.Color(colors[i][0], colors[i][1], colors[i][2], alphas[i]);
            }
          }
          const last = colors.length - 1;
          return new Cesium.Color(colors[last][0], colors[last][1], colors[last][2], alphas[last]);
        }

        window.handlePollutionReplayMessage = async (payload, transport) => {

              if (window.pollutionClouds && window.viewer.scene.primitives.contains(window.pollutionClouds)) {

              }
              window.pollutionClouds = null;              return;

            if (payload.action === 'start' && payload.gridPoints && payload.hours) {

              if (window.pollutionReplayTimer) {
                clearInterval(window.pollutionReplayTimer);
                window.pollutionReplayTimer = null;
              }
              if (window.pollutionClouds && window.viewer.scene.primitives.contains(window.pollutionClouds)) {
                window.viewer.scene.primitives.remove(window.pollutionClouds);
              }

              // Create cloud collection at grid point positions
              const clouds = new Cesium.CloudCollection();
              const ground2cloud = 1800;
              const cloudSX = 5000, cloudSY = 5000;

              // Compute altitude range to scale cloudSZ dynamically
              const altitudes = payload.gridPoints.map(gp => gp.altitude || 0);
              const minAlt = Math.min(...altitudes);
              const maxAlt = Math.max(...altitudes);
              const altRange = maxAlt - minAlt || 1;
              const minCloudSZ = 400, maxCloudSZ = 1000;

              payload.gridPoints.forEach(gp => {
                const alt = gp.altitude || 0;
                const normalizedAlt = (alt - minAlt) / altRange;
                const cloudSZ = maxCloudSZ - normalizedAlt * (maxCloudSZ - minCloudSZ);

                clouds.add({
                  position: Cesium.Cartesian3.fromDegrees(
                    gp.longitude,
                    gp.latitude,
                    alt + ground2cloud
                  ),
                  scale: new Cesium.Cartesian3(cloudSX, cloudSY, cloudSZ),
                  maximumSize: new Cesium.Cartesian3(cloudSX, cloudSY, cloudSZ),
                  slice: 0.016,
                  color: new Cesium.Color(0.9, 0.9, 0.9, 0.3),
                });
              });

              window.viewer.scene.primitives.add(clouds);
              window.pollutionClouds = clouds;
              // Animate through hours
              const replayParameter = payload.parameter || 'PM10';
              const hoursData = payload.hours;
              const intervalMs = payload.intervalMs || 1000;
              let frameIndex = 0;

              function paintFrame() {
                if (frameIndex >= hoursData.length) {
                  clearInterval(window.pollutionReplayTimer);
                  window.pollutionReplayTimer = null;                  return;
                }

                const frame = hoursData[frameIndex];
                const values = frame.values;
                const numClouds = Math.min(values.length, clouds.length);

                for (let i = 0; i < numClouds; i++) {
                  clouds.get(i).color = getColorForPollution(values[i], replayParameter);
                }

                window.viewer.scene.requestRender();                frameIndex++;
              }

              window.pollutionReplayTimer = setInterval(paintFrame, intervalMs);

        // Helper function to get sensor color based on parameter and value (matching 3D-city-model)
        function getSensorColorFromValue(param, value) {
          if (value === null || value === undefined) {
            return Cesium.Color.GRAY; // No data
          }

          const config = airQualityConfig[param] || airQualityConfig.default;

          if (config.isMeteo) {
            // Special handling for meteorological parameters
            const [minGood, maxGood, minBad, maxBad] = config.thresholds;
            if (value >= minGood && value <= maxGood) return config.cesiumColors[0];
            if (value < minBad || value > maxBad) return config.cesiumColors[2];
            return config.cesiumColors[1];
          } else {
            // Standard air quality parameters
            for (let i = 0; i < config.thresholds.length; i++) {
              if (value <= config.thresholds[i]) return config.cesiumColors[i];
            }
            return config.cesiumColors[config.cesiumColors.length - 1];
          }
        }

        // Helper function to create sensor icon (matching 3D-city-model design)
        function createSensorPin(color, text) {
          const iconSize = 32;
          const labelHeight = 30;
          const canvas = document.createElement('canvas');

          canvas.width = iconSize;
          canvas.height = iconSize + labelHeight;

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Draw text label at the top with outline and shadow
          const fontSize = 14;
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';

          // Black outline
          ctx.strokeStyle = 'rgba(0,0,0,0.7)';
          ctx.lineWidth = 4;
          ctx.strokeText(text, iconSize / 2, labelHeight - 2);

          // White fill with shadow
          ctx.fillStyle = 'white';
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 2;
          ctx.shadowOffsetX = 1;
          ctx.shadowOffsetY = 1;
          ctx.fillText(text, iconSize / 2, labelHeight - 2);

          // Black stroke again for definition
          ctx.strokeStyle = 'black';
          ctx.lineWidth = 1.5;
          ctx.strokeText(text, iconSize / 2, labelHeight - 2);

          // Final white fill
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = 'white';
          ctx.fillText(text, iconSize / 2, labelHeight - 2);

          // Draw pin shape
          ctx.beginPath();
          ctx.moveTo(16, labelHeight + 4);
          ctx.bezierCurveTo(24, labelHeight + 4, 28, labelHeight + 12, 16, labelHeight + 30);
          ctx.bezierCurveTo(4, labelHeight + 12, 8, labelHeight + 4, 16, labelHeight + 4);
          ctx.closePath();
          ctx.fillStyle = color.toCssColorString();
          ctx.fill();

          // Draw inner circle
          ctx.beginPath();
          ctx.arc(16, labelHeight + 12, 5, 0, 2 * Math.PI);
          ctx.fillStyle = 'white';
          ctx.fill();

          return canvas;
        }

        // Helper function to match quality level
        function matchesQualityLevel(value, param, qualityLevel) {
          if (value === null || value === undefined) return false;
          
          const config = airQualityConfig[param] || airQualityConfig.default;
          const level = qualityLevel.toLowerCase().replace(/\s+/g, '');
          
          if (config.isMeteo) {
            // Meteorological parameters use different logic
            const [minGood, maxGood, minBad, maxBad] = config.thresholds;
            if (level === 'normal' || level === 'good' || level === 'comfortable') {
              return value >= minGood && value <= maxGood;
            } else if (level === 'uncomfortable') {
              return (value > maxGood && value <= maxBad) || (value < minGood && value >= minBad);
            } else if (level === 'extreme') {
              return value > maxBad || value < minBad;
            }
          } else {
            // Standard air quality parameters
            const thresholds = config.thresholds;
            const labels = config.labels.map(l => l.toLowerCase().replace(/\s+/g, ''));
            const labelIndex = labels.indexOf(level);
            
            if (labelIndex !== -1) {
              if (labelIndex === 0) {
                return value <= thresholds[0];
              } else if (labelIndex === labels.length - 1) {
                return value > thresholds[thresholds.length - 1];
              } else {
                return value > thresholds[labelIndex - 1] && value <= thresholds[labelIndex];
              }
            }
          }
          
          return false;
        }

        // Helper function to match value filter
        function matchesValueFilter(value, filterValue) {
          if (value === null || value === undefined) return false;
          
          const match = filterValue.match(/^([><=]+)(.+)$/);
          if (!match) return false;
          
          const operator = match[1];
          const threshold = parseFloat(match[2]);
          
          if (operator === '>') return value > threshold;
          if (operator === '>=') return value >= threshold;
          if (operator === '<') return value < threshold;
          if (operator === '<=') return value <= threshold;
          if (operator === '==' || operator === '=') return value === threshold;
          
          return false;
        }

          servient.start(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('WoT servient start timeout')), 10000))
        ]);
        
        // Use the per-user Thing Description so event MQTT topics are scoped
        // to the authenticated user. Properties still point at the citymodel Thing.

          wot.requestThingDescription(citymodelUrl),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Thing description request timeout')), 15000))
        ]);
        
        const thing = await Promise.race([
          wot.consume(td),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Thing consumption timeout')), 10000))
        ]);        return thing;
      } catch (error) {
        console.error('❌ Failed to connect to WoT Thing:', error);
        throw error;
      }

    /* ========================= 3.1 Chat Panel Dragging ======================== */
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    // Initialize drag functionality
    function initChatPanelDrag() {
      const chatHeader = chatPanel.querySelector('.chat-header');
      
      chatHeader.addEventListener('mousedown', (e) => {
        // Don't start drag if clicking on input elements
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') {
          return;
        }
        
        isDragging = true;
        chatPanel.classList.add('dragging');
        
        const rect = chatPanel.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        
        e.preventDefault();
      });

      // Add drag functionality to the entire panel when minimized
      chatPanel.addEventListener('mousedown', (e) => {
        // Only handle drag on minimized panel, and not on buttons
        if (!chatPanel.classList.contains('minimized')) {
          return;
        }
        
        // Don't start drag if clicking on buttons
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
          return;
        }
        
        isDragging = true;
        chatPanel.classList.add('dragging');
        
        const rect = chatPanel.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const x = e.clientX - dragOffset.x;
        const y = e.clientY - dragOffset.y;
        
        // Keep panel within viewport bounds
        const maxX = window.innerWidth - chatPanel.offsetWidth;
        const maxY = window.innerHeight - chatPanel.offsetHeight;
        
        const constrainedX = Math.max(0, Math.min(x, maxX));
        const constrainedY = Math.max(0, Math.min(y, maxY));
        
        chatPanel.style.left = constrainedX + 'px';
        chatPanel.style.top = constrainedY + 'px';
        chatPanel.style.right = 'auto';
        chatPanel.style.bottom = 'auto';
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          chatPanel.classList.remove('dragging');
        }
      });

      // Prevent text selection while dragging
      chatHeader.addEventListener('selectstart', (e) => {
        e.preventDefault();
      });
    }

    // Initialize drag functionality when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initChatPanelDrag);
    } else {
      initChatPanelDrag();
    }

    /* ========================= 3.15 Chat Panel Resize (top edge) ======================== */
    function initChatPanelResize() {
      const resizeHandle = document.getElementById('resizeHandleTop');
      if (!resizeHandle) return;

      const MIN_HEIGHT = 300;
      let isResizing   = false;
      let startY       = 0;
      let startHeight  = 0;
      let startTop     = 0;  // panel top in viewport px at resize start

      resizeHandle.addEventListener('mousedown', (e) => {
        if (chatPanel.classList.contains('minimized')) return;
        e.preventDefault();
        e.stopPropagation();

        // Capture current geometry in viewport coordinates
        const rect  = chatPanel.getBoundingClientRect();
        startY      = e.clientY;
        startHeight = rect.height;
        startTop    = rect.top;

        // Switch to absolute top+left positioning so we can move the top edge freely
        // (panel may still be using bottom/right from its initial CSS)
        chatPanel.style.top    = startTop + 'px';
        chatPanel.style.left   = rect.left + 'px';
        chatPanel.style.right  = 'auto';
        chatPanel.style.bottom = 'auto';

        isResizing = true;
        chatPanel.classList.add('resizing');
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        // Bottom edge stays fixed; only the top moves
        const panelBottom = startTop + startHeight;

        // New top follows the cursor, clamped so the panel never leaves the viewport
        // and never gets shorter than MIN_HEIGHT
        const rawTop     = startTop + (e.clientY - startY);
        const maxTop     = panelBottom - MIN_HEIGHT;   // keep at least MIN_HEIGHT
        const newTop     = Math.max(0, Math.min(rawTop, maxTop));
        const newHeight  = panelBottom - newTop;

        chatPanel.style.top    = newTop    + 'px';
        chatPanel.style.height = newHeight + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          chatPanel.classList.remove('resizing');
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initChatPanelResize);
    } else {
      initChatPanelResize();
    }

    async function startListeningMode({ interruptionMode = false} = {}) {
      try {
        // Request high-quality audio with echo cancellation and noise suppression
        stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,  // Automatically adjust microphone gain
            sampleRate: 48000       // Higher sample rate for better quality
          } 
        });        state = 'LISTENING';
        audioCtx = new AudioContext();
        sourceNode = audioCtx.createMediaStreamSource(stream);
        
        // Add a gain node to boost audio if needed
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 1.5;  // Boost audio by 50%
        
        analyser = audioCtx.createAnalyser();
        sourceNode.connect(gainNode);
        gainNode.connect(analyser);
    
        // Configure MediaRecorder with optimal audio quality
        const options = {
          mimeType: 'audio/webm;codecs=opus',
          audioBitsPerSecond: 128000  // 128 kbps for clear speech
        };
        
        // Fallback for browsers that don't support the preferred format
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = 'audio/webm';
        }
        
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    
        mediaRecorder.onstart = () => {
          performanceMetrics.recordingStart = performance.now();
          if(!interruptionMode){          } else{          }
            initVAD();
        };
    
        mediaRecorder.start();

        redemptionFrames: 8,              // Frames to wait before declaring speech end (default: 8)
        preSpeechPadFrames: 20,          // Capture 20 frames (~600ms) BEFORE speech starts - prevents cutting off first words!
        minSpeechFrames: 3,              // Minimum frames to consider as speech (default: 3)
        submitUserSpeechOnPause: true,   // Auto-submit when pause detected

          }
        },
        onFrameProcessed: (probs, frame) => {
          if (!probs) return;

          // Decide current state
          const currentSpeachSilanceState = probs.isSpeech > probs.notSpeech ? "speech" : "silence";

          // Print only if state changed

    // === Silence Detection ===
    function detectSilence({
      volumeThreshold = 0.04,   // Minimum RMS to be considered voice
      silenceDelay = 1500,       // ms of silence before stopping
      minSpeakingTime = 300,     // Must speak this long to count as speech
      speechGapTolerance = 1200,   // Allow brief pauses in speech without resetting
    } = {}) {
      const bufferLength = analyser.fftSize;
      const dataArray = new Uint8Array(bufferLength);
      let silenceStart = null;
      let speakingStart = null;
      let wasSpeaking = false;
      let inSpeechSession = false; // Track if we're in an active speech session
    
      const checkSilence = () => {
        analyser.getByteTimeDomainData(dataArray);
    
        const rms = Math.sqrt(dataArray.reduce((sum, val) => {
          const norm = (val - 128) / 128;
          return sum + norm * norm;
        }, 0) / bufferLength);
    
        const now = Date.now();
    
        if (rms > volumeThreshold) {
          // Voice detected
          if (!wasSpeaking) {
            clearTimeout(inactivityTimeout);
            if (!inSpeechSession) {
              speakingStart = now;            }
            wasSpeaking = true;
            silenceStart = null;
            
            // Clear any pending silence timeout
            if (silenceTimer) {
              clearTimeout(silenceTimer);
              silenceTimer = null;
            }
            // Handle interruption IMMEDIATELY when voice is detected during bot speech
            if (!isqamode && currentAudio) {              interruptTTS();
            }
          }
    
          // Check if we've been speaking long enough to consider this valid speech
          if (speakingStart && now - speakingStart > minSpeakingTime && !inSpeechSession) {
            inSpeechSession = true;
          }
        } else {
          // Silence detected
          if (wasSpeaking) {
            if (silenceStart === null) {
              silenceStart = now;
            }
            
            // Only reset wasSpeaking after speech gap tolerance
            if (now - silenceStart > speechGapTolerance) {
              wasSpeaking = false;
            }
          }
    
          // Set timeout to stop recording only if we're in a speech session
          // and haven't set a timer yet
          if (inSpeechSession && silenceStart && !silenceTimer) {
            silenceTimer = setTimeout(() => {
              if (state === 'LISTENING') {                stopRecordingAndProcess(true);
              }
            }, silenceDelay);
          }
        }
    
        if (state === 'LISTENING') {
          requestAnimationFrame(checkSilence);
        }
      };
    
      checkSilence();
    }
    
    // === Stop + Process Recording ===
    function stopRecordingAndProcess(interruptionMode = false) {
      if (state !== 'LISTENING') {        unlockUI();
        return;
      }

      // Check if mediaRecorder is still active
      if (!mediaRecorder || mediaRecorder.state !== 'recording') {        unlockUI();
        return;
      }

      if (myvad) {
        try {
          myvad.pause();        } catch (err) {
          console.error("⚠️ Error pausing VAD in stopRecordingAndProcess:", err);
        }
      }

      if (inactivityTimeout){
        clearTimeout(inactivityTimeout);
        inactivityTimeout = null
      }
    
      performanceMetrics.recordingEnd = performance.now();
      performanceMetrics.totalStart = performanceMetrics.recordingStart; // Total starts from recording
    
      // Calculate recording duration
      const recordingDuration = performanceMetrics.recordingEnd - performanceMetrics.recordingStart;      logTiming('🎙️ Recording Duration', performanceMetrics.recordingStart, performanceMetrics.recordingEnd);
    
      // Minimum recording duration check (500ms) - prevents accidental clicks
      const MIN_RECORDING_DURATION = 500; // milliseconds
      if (recordingDuration < MIN_RECORDING_DURATION) {        mediaRecorder.stop();
        state = 'IDLE';
        unlockUI();
        return;
      }
    
      mediaRecorder.stop();
      state = 'PROCESSING';
    
      mediaRecorder.onstop = async () => {
   
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        
        const audioBuffer = await audioBlob.arrayBuffer();
        
        // Validate audioBuffer before passing to transcribeAudio
        if (!audioBuffer || audioBuffer.byteLength === 0) {
          unlockUI();
          return;
        }
        
        if (audioBuffer.byteLength > 25 * 1024 * 1024) { // 25MB limit
          unlockUI();
          return;
        }
    
        try {
          const text = await transcribeAudio(audioBuffer);
          await handleUserTextStream(text);
        } catch (err) {
          console.error("🔥 Processing error:", err);
          console.error(" Processing error stack:", err.stack);
          unlockUI();
        }
        
        // QA mode - no continuous listening
      };
    }

    async function transcribeAudio(audioBuffer) {
      // Add call stack tracking to detect infinite recursion
      if (!window.transcribeAudioCallCount) {
        window.transcribeAudioCallCount = 0;
      }
      window.transcribeAudioCallCount++;

      // Check for potential infinite recursion
      if (window.transcribeAudioCallCount > 5) {
        console.error(`🚨 CRITICAL: transcribeAudio called ${window.transcribeAudioCallCount} times - potential infinite recursion!`);
        window.transcribeAudioCallCount = 0; // Reset counter
        throw new Error('Maximum transcribeAudio call limit exceeded - infinite recursion detected');
      }
      
      // Reset counter after a delay to allow for legitimate retries
      setTimeout(() => {
        if (window.transcribeAudioCallCount > 0) {          window.transcribeAudioCallCount = 0;
        }
      }, 5000);
      
      performanceMetrics.sttStart = performance.now();
      
      try {
        
        // Check if audioBuffer is valid before processing
        if (!audioBuffer || !(audioBuffer instanceof ArrayBuffer) || audioBuffer.byteLength === 0) {
          throw new Error(`Invalid audioBuffer: type=${typeof audioBuffer}, byteLength=${audioBuffer?.byteLength || 'N/A'}`);
        }
        
        // Convert audio buffer to base64 - optimized approach
        let base64Audio;
        try {
          const uint8Array = new Uint8Array(audioBuffer);          
          // Use optimized chunked conversion for all sizes to prevent memory issues
          const chunks = [];
          const chunkSize = 32768; // 32KB chunks for optimal performance
          
          for (let i = 0; i < uint8Array.length; i += chunkSize) {
            const chunk = uint8Array.subarray(i, Math.min(i + chunkSize, uint8Array.length));
            chunks.push(String.fromCharCode(...chunk));
          }
          base64Audio = btoa(chunks.join(''));        } catch (base64Error) {
          console.error('❌ Base64 conversion error:', base64Error);
          throw new Error(`Base64 conversion failed: ${base64Error.message}`);
        }        
        // Show visual feedback for transcription
        messageInput.placeholder = "🎤 Transcribing audio...";
        
        // Check if llmThing is available
        if (!window.llmThing) {
          messageInput.placeholder = "Type your message here...";
          throw new Error('LLM Thing is not connected');
        }
        
        // Generate a client-side requestId to ensure handler is ready before backend events arrive
        const clientRequestId = `stt-client-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        
        // Set up the promise and handler BEFORE invoking the action to avoid race condition
        const transcriptionPromise = new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {            // Clean up the pending request handler
            if (window.pendingSTTRequests && window.pendingSTTRequests[clientRequestId]) {
              delete window.pendingSTTRequests[clientRequestId];
            }
            reject(new Error('STT transcription timeout'));
          }, 30000); // 30 second timeout
          
          // Store the request handler in a global registry for the existing subscription to use
          if (!window.pendingSTTRequests) {
            window.pendingSTTRequests = {};
          }          
          window.pendingSTTRequests[clientRequestId] = {
            resolve: (text) => {
                clearTimeout(timeout);
                performanceMetrics.sttEnd = performance.now();
                logTiming('🧠 STT Processing', performanceMetrics.sttStart, performanceMetrics.sttEnd);              messageInput.placeholder = "Type your message here..."; // Reset placeholder
              window.transcribeAudioCallCount--; // Decrement on successful completion
              delete window.pendingSTTRequests[clientRequestId];
              resolve(text || "(Could not transcribe)");
            },
            reject: (error) => {
                clearTimeout(timeout);
                performanceMetrics.sttEnd = performance.now();
                logTiming('🧠 STT Error', performanceMetrics.sttStart, performanceMetrics.sttEnd);
              console.error("🧾 Transcription error:", error);
              messageInput.placeholder = "Type your message here..."; // Reset placeholder
              window.transcribeAudioCallCount--; // Decrement on error
              delete window.pendingSTTRequests[clientRequestId];
              reject(new Error(error || 'STT transcription failed'));
            }
          };
        });
        
        // Now invoke the action - handler is already registered
        const result = await window.llmThing.invokeAction('transcribeAudio', {
          audio: base64Audio,
          language: 'en',
          task: 'transcribe',
          suppressNonSpeechTokens: true,
          clientRequestId: clientRequestId,  // Pass our client-side requestId to backend
          userId: window.currentUserId        // Scope STT progress events to this user
        });  
        
        const actionResult = typeof result.value === 'function' ? await result.value() : result;
        
        if (!actionResult.started) {
          // Clean up handler if action failed to start
          delete window.pendingSTTRequests[clientRequestId];
          throw new Error(actionResult.message || 'Failed to start transcription');
        }
        // Wait for transcription completion via event
        return transcriptionPromise;
        
      } catch (error) {
        console.error(` transcribeAudio caught error:`, error);
        console.error(` Error stack:`, error.stack);
        performanceMetrics.sttEnd = performance.now();
        logTiming('🧠 STT Error', performanceMetrics.sttStart, performanceMetrics.sttEnd);
        console.error("STT Error:", error);
        window.transcribeAudioCallCount--; // Decrement on error
        throw error;
      }
    }

    async function getSpeech(text) {
      performanceMetrics.ttsStart = performance.now();
      
      try {
        // Check if llmThing is available
        if (!window.llmThing) {
          throw new Error('LLM Thing is not connected');
        }        
        // Use WoT action instead of REST endpoint
        const preferredVoice = localStorage.getItem('tts_voice') || 'af_sky';
        const preferredLang = localStorage.getItem('tts_language') || 'en';        
        const result = await window.llmThing.invokeAction('textToSpeech', { 
          text: text,
          language: preferredLang,
          voice: preferredVoice
        });

        performanceMetrics.ttsEnd = performance.now();
        logTiming('🔊 TTS Generation', performanceMetrics.ttsStart, performanceMetrics.ttsEnd);        
        // CRITICAL: WoT actions should ALWAYS be accessed via result.value()
        // Do NOT access result.data directly as it locks the stream before we can read it
        let actualResult;
        
        if (result.value && typeof result.value === 'function') {          try {
            actualResult = await result.value();          } catch (err) {
            console.error('🔊 DEBUG FRONTEND: result.value() failed:', err);
            throw new Error('Unable to read TTS data from WoT action: ' + err.message);
          }
        } else {
          throw new Error('result.value() is not available - cannot read TTS data');
        }
        if (!actualResult || !actualResult.success) {
          throw new Error(actualResult?.error || 'TTS action failed');
        }

        if (!actualResult.audio) {
          throw new Error('No audio data received from TTS service');
        }

        // Convert base64 audio to blob
        const audioData = atob(actualResult.audio);
        const audioArray = new Uint8Array(audioData.length);
        for (let i = 0; i < audioData.length; i++) {
          audioArray[i] = audioData.charCodeAt(i);
        }
        
        const blob = new Blob([audioArray], { type: 'audio/wav' });        return blob;

      } catch (error) {
        performanceMetrics.ttsEnd = performance.now();
        logTiming('🔊 TTS Error', performanceMetrics.ttsStart, performanceMetrics.ttsEnd);
        console.error('❌ TTS error:', error);
        throw error;
      }
    }

    // Simple markdown to HTML converter
    function markdownToHtml(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold **text**
        .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic *text*
        .replace(/\n\n/g, '<br><br>') // Double line breaks
        .replace(/\n/g, '<br>') // Single line breaks
        .replace(/^### (.*$)/gim, '<h3>$1</h3>') // H3 headers
        .replace(/^## (.*$)/gim, '<h2>$1</h2>') // H2 headers
        .replace(/^# (.*$)/gim, '<h1>$1</h1>') // H1 headers
        .replace(/- (.*)/g, '• $1'); // Bullet points
    }

    // Sanitize text for TTS - remove markdown formatting, emojis, and special characters
    function sanitizeTextForTTS(text) {
      if (!text) return '';
      
      return text
        // Remove Bulgarian text in parentheses (Cyrillic characters)
        .replace(/\([^()]*[\u0400-\u04FF\u0500-\u052F][^()]*\)/g, '') // Remove (Bulgarian text)
        
        // Remove markdown formatting
        .replace(/\*\*(.*?)\*\*/g, '$1') // Bold **text** -> text
        .replace(/\*(.*?)\*/g, '$1') // Italic *text* -> text
        .replace(/__(.*?)__/g, '$1') // Bold __text__ -> text
        .replace(/_(.*?)_/g, '$1') // Italic _text_ -> text
        .replace(/~~(.*?)~~/g, '$1') // Strikethrough ~~text~~ -> text
        .replace(/`([^`]+)`/g, '$1') // Inline code `text` -> text
        .replace(/```[\s\S]*?```/g, '') // Code blocks -> remove
        .replace(/#{1,6}\s+/g, '') // Headers # -> remove
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1') // Links [text](url) -> text
        .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1') // Images ![alt](url) -> alt
        .replace(/^\s*[-*+]\s+/gm, '') // List markers -> remove
        .replace(/^\s*\d+\.\s+/gm, '') // Numbered list markers -> remove
        .replace(/^\s*>\s+/gm, '') // Blockquotes -> remove
        .replace(/\|/g, ' ') // Table pipes -> space
        .replace(/[-=]{3,}/g, '') // Horizontal rules -> remove
        
        // Remove emojis (comprehensive emoji regex)
        .replace(/[\u{1F600}-\u{1F64F}]/gu, '') // Emoticons
        .replace(/[\u{1F300}-\u{1F5FF}]/gu, '') // Misc Symbols and Pictographs
        .replace(/[\u{1F680}-\u{1F6FF}]/gu, '') // Transport and Map
        .replace(/[\u{1F1E0}-\u{1F1FF}]/gu, '') // Flags
        .replace(/[\u{2600}-\u{26FF}]/gu, '')   // Misc symbols
        .replace(/[\u{2700}-\u{27BF}]/gu, '')   // Dingbats
        .replace(/[\u{1F900}-\u{1F9FF}]/gu, '') // Supplemental Symbols and Pictographs
        .replace(/[\u{1FA00}-\u{1FA6F}]/gu, '') // Chess Symbols
        .replace(/[\u{1FA70}-\u{1FAFF}]/gu, '') // Symbols and Pictographs Extended-A
        .replace(/[\u{FE00}-\u{FE0F}]/gu, '')   // Variation Selectors
        .replace(/[\u{1F200}-\u{1F251}]/gu, '') // Enclosed characters
        
        // Remove other special characters that don't speak well
        .replace(/[•●○◆◇■□▪▫]/g, '') // Bullet points and shapes
        .replace(/[™®©]/g, '') // Trademark symbols
        .replace(/[←→↑↓↔↕]/g, '') // Arrows
        .replace(/[✓✗✕✖]/g, '') // Check marks
        
        // Convert technical units to TTS-friendly words
        .replace(/µg\/m³/gi, 'micrograms per cubic meter') // µg/m³ -> micrograms per cubic meter
        .replace(/kWh\/m²\/year/gi, 'kilowatt-hours per square meter per year') // kWh/m²/year -> kilowatt-hours per square meter per year
        .replace(/km\/h/gi, 'kilometers per hour') // km/h -> kilometers per hour
        .replace(/hPa/gi, 'hectopascals') // hPa -> hectopascals
        .replace(/°C/gi, 'degrees Celsius') // °C -> degrees Celsius
        .replace(/°F/gi, 'degrees Fahrenheit') // °F -> degrees Fahrenheit
        .replace(/m\/s/gi, 'meters per second') // m/s -> meters per second
        .replace(/km\/s/gi, 'kilometers per second') // km/s -> kilometers per second
        .replace(/cm\//gi, 'centimeters per ') // cm/s -> centimeters per second
        .replace(/mm\//gi, 'millimeters per ') // mm/s -> millimeters per second
        .replace(/m²/gi, 'square meters') // m² -> square meters
        .replace(/m³/gi, 'cubic meters') // m³ -> cubic meters
        
        // Clean up whitespace
        .replace(/\n\n+/g, '. ') // Multiple newlines -> period and space
        .replace(/\n/g, '. ') // Single newlines -> period and space
        .replace(/\s+/g, ' ') // Multiple spaces -> single space
        .replace(/\.\s*\./g, '.') // Multiple periods -> single period
        .replace(/\s+\./g, '.') // Space before period -> just period
        .trim();
    }
